<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auto Serch</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #fff);
    --text: var(--tg-theme-text-color, #111);
    --hint: var(--tg-theme-hint-color, #888);
    --link: var(--tg-theme-link-color, #2a7ae2);
    --card: var(--tg-theme-secondary-bg-color, #f2f2f5);
    --btn: var(--tg-theme-button-color, #2a7ae2);
    --btn-text: var(--tg-theme-button-text-color, #fff);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
  header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px;
           padding: 10px 12px; background: var(--bg); border-bottom: 1px solid var(--card); }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  .lamp { width: 14px; height: 14px; border-radius: 50%; background: var(--hint); flex: none; }
  .lamp.green { background: #2ecc71; box-shadow: 0 0 6px #2ecc71; }
  .lamp.yellow { background: #f1c40f; box-shadow: 0 0 6px #f1c40f; }
  .lamp.red { background: #e74c3c; box-shadow: 0 0 6px #e74c3c; }
  #health-text { font-size: 12px; color: var(--hint); padding: 4px 12px 0; }
  main { padding: 8px 12px 24px; }
  .section { margin: 14px 0 6px; font-size: 13px; color: var(--hint); text-transform: uppercase; }
  .row { display: flex; gap: 10px; padding: 8px; margin-bottom: 8px; border-radius: 10px; background: var(--card); cursor: pointer; }
  .row img { width: 92px; height: 70px; object-fit: cover; border-radius: 8px; flex: none; background: #ccc; }
  .row .t { font-weight: 600; }
  .row .s { font-size: 13px; color: var(--hint); }
  .badge { display: inline-block; min-width: 34px; padding: 1px 6px; border-radius: 6px; text-align: center;
           font-weight: 700; color: #fff; background: #888; }
  .b-hi { background: #27ae60; } .b-mid { background: #e6a700; } .b-lo { background: #c0392b; }
  .empty { color: var(--hint); padding: 20px 0; text-align: center; }
  .back { border: 0; background: none; color: var(--link); font-size: 15px; padding: 0; cursor: pointer; }
  .gallery { display: flex; gap: 6px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -12px; padding: 0 12px; }
  .gallery img { height: 220px; border-radius: 8px; scroll-snap-align: start; flex: none; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 14px; }
  .kv b { color: var(--hint); font-weight: 400; }
  .box { background: var(--card); border-radius: 10px; padding: 10px; margin-top: 10px; }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .actions button, .actions a { flex: 1; padding: 10px; border: 0; border-radius: 10px; font-size: 15px;
           text-align: center; text-decoration: none; cursor: pointer; background: var(--card); color: var(--text); }
  .actions .on { background: var(--btn); color: var(--btn-text); }
  .err { color: #e74c3c; padding: 20px 0; }
</style>
</head>
<body>
<header>
  <span class="lamp" id="lamp" title=""></span>
  <h1 id="title">Рейтинг</h1>
</header>
<div id="health-text"></div>
<main id="app"><div class="empty">Загрузка…</div></main>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const initData = tg ? tg.initData : "";
const app = document.getElementById("app");

async function api(path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: { "Content-Type": "application/json", "X-Telegram-Init-Data": initData, ...(options.headers || {}) },
  });
  if (res.status === 401) throw new Error("Нет доступа. Откройте приложение из бота.");
  if (!res.ok) throw new Error("Ошибка " + res.status);
  return res.json();
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function badge(score) {
  const cls = score >= 70 ? "b-hi" : score >= 50 ? "b-mid" : "b-lo";
  return `<span class="badge ${cls}">${score}</span>`;
}

function openLink(url) {
  if (tg && tg.openLink) tg.openLink(url); else window.open(url, "_blank");
}

async function loadHealth() {
  try {
    const h = await api("/api/health");
    document.getElementById("lamp").className = "lamp " + h.lamp;
    document.getElementById("health-text").textContent = h.text;
  } catch (e) {
    document.getElementById("lamp").className = "lamp red";
    document.getElementById("health-text").textContent = e.message;
  }
}

function rowHtml(a, i) {
  return `<div class="row" data-id="${esc(a.id)}">
    <img src="${esc(a.photo)}" alt="" loading="lazy">
    <div>
      <div class="t">${i + 1}. ${esc(a.name)}, ${esc(a.year)} ${badge(a.total_score)}</div>
      <div class="s">${esc(a.price)} ₼ · ${esc(a.city)} · ${a.distance_km ?? "?"} км · ${esc(a.fuel)}${a.credit ? " · кредит" : ""}</div>
      <div class="s">Баллы рейтинга: ${a.rank}${a.has_ac === 1 ? " · ❄️" : ""}</div>
    </div>
  </div>`;
}

async function showTop() {
  document.getElementById("title").textContent = "Рейтинг";
  if (tg) tg.BackButton.hide();
  app.innerHTML = '<div class="empty">Загрузка…</div>';
  try {
    const { ads } = await api("/api/top");
    const liked = ads.filter((a) => a.status === "interesting");
    const fresh = ads.filter((a) => a.status !== "interesting");
    let html = `<div class="section">Интересно (${liked.length})</div>`;
    html += liked.length ? liked.map(rowHtml).join("") : '<div class="empty">Пока пусто. Отмечайте 👍 в боте или в карточке.</div>';
    html += `<div class="section">Новые, без отметки (${fresh.length})</div>`;
    html += fresh.length ? fresh.map(rowHtml).join("") : '<div class="empty">Новых нет</div>';
    app.innerHTML = html;
    app.querySelectorAll(".row").forEach((el) => el.addEventListener("click", () => showAd(el.dataset.id)));
  } catch (e) {
    app.innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

async function showAd(id) {
  document.getElementById("title").textContent = "Машина";
  if (tg) { tg.BackButton.show(); }
  app.innerHTML = '<div class="empty">Загрузка…</div>';
  try {
    const { ad, review: r, prices } = await api("/api/ad/" + encodeURIComponent(id));
    const ac = r && r.has_ac === 1 ? "есть" : r && r.has_ac === 0 ? "нет" : "?";
    const priceLine = prices.map((p) => `${p.price} ₼ (${p.seen_at.slice(0, 10)})`).join(" → ");
    app.innerHTML = `
      ${tg ? "" : '<button class="back" id="back">← Назад</button>'}
      <h2 style="margin:8px 0">${esc(ad.name)}, ${esc(ad.year)}</h2>
      <div class="gallery">${ad.photos.map((u) => `<img src="${esc(u)}" loading="lazy" alt="">`).join("")}</div>
      <div class="box kv">
        <b>Цена</b><span>${esc(ad.price)} ₼${ad.credit ? " · кредит/обмен" : ""}</span>
        <b>Город</b><span>${esc(ad.city)} · ${ad.distance_km ?? "?"} км</span>
        <b>Мотор</b><span>${esc(ad.engine)} · ${esc(ad.fuel)}</span>
        <b>Пробег</b><span>${esc(ad.mileage_km)} км (не верим)</span>
        <b>История цены</b><span>${esc(priceLine)}</span>
      </div>
      ${r ? `<div class="box">
        <div style="margin-bottom:6px">Оценка ИИ ${badge(r.total_score)}</div>
        <div class="kv">
          <b>Кузов</b><span>${r.body_score}/10</span>
          <b>Ржавчина</b><span>${r.rust_score}/10 (10 = нет)</span>
          <b>Салон</b><span>${r.interior_score}/10</span>
          <b>Кондиционер</b><span>${ac}</span>
        </div>
        <p><b>ДТП:</b> ${esc(r.accident_signs)}</p>
        <p><b>Реальный пробег и мотор:</b> ${esc(r.real_mileage_note).replace(/\n/g, "<br>")}</p>
        <p>${esc(r.summary)}</p>
      </div>` : ""}
      <div class="actions">
        <button id="like" class="${ad.status === "interesting" ? "on" : ""}">👍 Интересно</button>
        <button id="nope" class="${ad.status === "rejected" ? "on" : ""}">👎 Нет</button>
      </div>
      <div class="actions"><a href="#" id="open">Открыть на Turbo.az</a></div>`;

    const mark = async (status) => {
      await api(`/api/ad/${encodeURIComponent(id)}/mark`, { method: "POST", body: JSON.stringify({ status }) });
      if (tg) tg.HapticFeedback.notificationOccurred("success");
      showTop();
    };
    document.getElementById("like").onclick = () => mark(ad.status === "interesting" ? "sent" : "interesting");
    document.getElementById("nope").onclick = () => mark("rejected");
    document.getElementById("open").onclick = (e) => { e.preventDefault(); openLink(ad.url); };
    const back = document.getElementById("back");
    if (back) back.onclick = showTop;
  } catch (e) {
    app.innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

if (tg) tg.BackButton.onClick(showTop);
loadHealth();
showTop();
setInterval(loadHealth, 60000);
</script>
</body>
</html>
